
name: Financial Market Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check linting
        run: |
          python -m ruff check src tests airflow_tests dags run_pipeline.py

      - name: Check formatting
        run: |
          python -m ruff format --check src tests airflow_tests dags run_pipeline.py

      - name: Validate Airflow startup script
        run: bash -n scripts/start_airflow.sh

  unit-tests:
    name: ETL Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ETL tests without database integration
        env:
          RUN_DB_TESTS: "0"
        run: |
          python -m pytest -q --tb=short
