[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-market-data-pipeline"
version = "0.1.0"
description = "Automated financial market ETL/ELT pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32,<3",
    "pandas>=2.3,<4",
    "pyarrow>=22,<27",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
